global:
  scrape_interval: 15s

scrape_configs:
  # Scrape metrics that the OTel Collector exposes via its Prometheus exporter
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Scrape Dagu server's Prometheus-compatible metrics endpoint
  - job_name: 'follower-server'
    metrics_path: /metrics
    static_configs:
      - targets: ['follower:8080']