services:
  follower:
    image: follower:latest
    depends_on:
      - postgres
      - minio
      - redis
    environment:
      PLAYWRIGHT_DRIVER_PATH: /opt/playwright-driver
      PLAYWRIGHT_NODEJS_PATH: /opt/playwright-driver/node
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      FOLLOWER_PROXY_ENABLED: "false"
      FOLLOWER_SESSION_BOOTSTRAP_LOGIN_ENABLED: "true"
      FOLLOWER_SESSION_ALLOW_MISSING_PAYLOAD_ON_FIRST_RUN: "true"
      FOLLOWER_WORKER_LOOP_INTERVAL_SECONDS: "1"
      OSKELLY_LOGIN: 'gm-liker@yandex.ru'
      OSKELLY_PASSWORD: 'rWF-UhV-8pb-U7M'
    labels:
      follower.endpoint.healthz.host: "http://localhost:${FOLLOWER_HTTP_PORT:-8080}/healthz"
      follower.endpoint.metrics.host: "http://localhost:${FOLLOWER_HTTP_PORT:-8080}/metrics"
    ports:
      - "${FOLLOWER_HTTP_PORT:-8080}:8080"
    configs:
      - source: follower_config
        target: /app/config.yaml
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks: [follower-net]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [follower-net]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-follower_automation}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/db-migrations:ro
      - ./scripts/postgres-init-migrations.sh:/docker-entrypoint-initdb.d/010-apply-migrations.sh:ro
    networks: [follower-net]

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [follower-net]

  jaeger:
    image: jaegertracing/all-in-one:latest
    networks: [follower-net]
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC ingest

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector.yaml"]
    configs:
      - source: otel_collector_config
        target: /etc/otel-collector.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger
    networks: [follower-net]

  prometheus:
    image: prom/prometheus:latest
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - follower
    networks: [follower-net]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [follower-net]

volumes:
  postgres_data:
  minio_data:
  redis_data:
  grafana-data:
    driver: local

configs:
  follower_config:
    file: ./config.compose.yaml
  prometheus_config:
    file: ./prometheus.yaml
  otel_collector_config:
    file: ./otel-collector.yaml

networks:
  follower-net:
    driver: bridge